
pipelines:
  dim:
    bloomberg:
      security:
        shared_fields:
          - PARSEKYABLE_DES
          - ID_ISIN
          - TICKER
          - NAME
          - SHORT_NAME
          - SECURITY_NAME
          - ID_BB_SEC_NUM_DES
          - CRNCY
          - COUNTRY
          - EXCH_CODE
          - MARKET_SECTOR_DES
          - SECURITY_TYP
          - MARKET_STATUS
          - EXCH_MARKET_STATUS
        equity_fields:
          - INDUSTRY_SECTOR
        fund_fields:
          - FUND_TYP
          - FUND_ASSET_CLASS_FOCUS
          - FUND_GEO_FOCUS
          - FUND_OBJECTIVE_LONG
  prices:
    sbs:
      discovery:
        # SBS tipo_instrumento values Bloomberg does not cover. Discovery
        # registers these as entities like any other (they have SBS prices
        # and the funds hold them) but does NOT write the '/isin/' Bloomberg
        # parsekyable alias, so dim enrichment never asks about them
        # (docs/BLOOMBERG_SBS.md §2). Matched case-insensitively with all
        # whitespace removed, so 'FON. INV. TRAD' and 'FON.INV.TRAD' are one.
        # These types also map to the first two digits of codigo_sbs.
        no_bloomberg_coverage:
          - CD BCRP          # central bank certificates of deposit
          - CDV BCRP
          - CD BCRP R
          - CDLD BCRP
          - FMAEL            # local alternative / traditional funds
          - FMAE
          - FON. INV. TRAD
          - FON.INV.ALT
        
