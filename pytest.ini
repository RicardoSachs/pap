[pytest]
# Make `src` importable when tests run from the repo root, and confine
# collection to tests/ (avoids sweeping .venv).
pythonpath = .
testpaths = tests
# importlib mode lets same-basename test files coexist across feeds
# (forwards/test_transform.py + cash/test_transform.py) without __init__.py.
addopts = --import-mode=importlib
